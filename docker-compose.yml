name: fitops

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    # Deliberately no `ports:` — Mongo is reachable only from the compose
    # network, never from the host or the internet.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/fitops?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: production
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fitops.lk}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_STAFF_EMAIL: ${SEED_STAFF_EMAIL:-staff@fitops.lk}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-staff123}
    depends_on:
      mongo:
        condition: service_healthy
    # Also no `ports:` — the only way in is through nginx on the web service.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
